<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>大武林野調查｜互動故事地圖</title>

<script src="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.js"></script>
<link
    href="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.css"
    rel="stylesheet"
/>

<style>
* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    height: 100%;
}

body {
    font-family:
        "Noto Serif TC",
        "PingFang TC",
        "Microsoft JhengHei",
        serif;

    color: #292929;
    background: #f7f5f0;
}


/* =========================================================
   整體左右雙欄
========================================================= */

#container {
    display: flex;
    width: 100%;
    min-height: 100vh;
}


/* =========================================================
   左側文章
========================================================= */

#story {
    width: 45%;
    min-height: 100vh;
    padding: 70px 55px;
    background: #f7f5f0;
    position: relative;
    z-index: 2;
}

#story h1 {
    font-size: 30px;
    line-height: 1.6;
    margin: 0 0 10px 0;
}

.author {
    color: #666;
    margin-bottom: 45px;
    font-size: 18px;
}


/* 不替文章亂切段 */

.paper-body {
    font-size: 18px;
    line-height: 2.15;
}

.paper-body p {
    margin:
        0
        0
        30px
        0;

    text-align: justify;
    text-indent: 2em;
}


/* =========================================================
   地名
========================================================= */

.place-link {
    cursor: pointer;

    /*
       預設不畫底線。
       只有滑鼠碰到時才出現。
    */

    border-bottom: 2px solid transparent;

    transition:
        color 0.2s ease,
        border-color 0.2s ease;
}

.place-link:hover {
    color: #9b3d20;
    border-bottom-color: #9b3d20;
}


/* =========================================================
   右側地圖
========================================================= */

#map-container {
    width: 55%;
    height: 100vh;

    position: sticky;
    top: 0;

    background: #ddd;
}

#map {
    width: 100%;
    height: 100%;
}


/* =========================================================
   地圖右上角目前地名
========================================================= */

#place-info {
    position: absolute;

    top: 20px;
    right: 20px;

    z-index: 10;

    max-width: 260px;

    padding: 12px 16px;

    background:
        rgba(255,255,255,0.94);

    border-radius: 6px;

    box-shadow:
        0 3px 15px rgba(0,0,0,0.18);

    font-size: 15px;

    opacity: 0;

    pointer-events: none;

    transition:
        opacity 0.2s ease;
}

#place-info.visible {
    opacity: 1;
}


/* =========================================================
   SVG 連線
========================================================= */

#connection-layer {
    position: fixed;

    top: 0;
    left: 0;

    width: 100vw;
    height: 100vh;

    pointer-events: none;

    z-index: 20;
}

#connection-line {
    fill: none;

    stroke: #9b3d20;

    stroke-width: 2.5;

    stroke-linecap: round;

    filter:
        drop-shadow(
            0 1px 2px
            rgba(0,0,0,0.25)
        );

    opacity: 0;

    transition:
        opacity 0.15s ease;
}

#connection-dot {
    fill: #9b3d20;

    opacity: 0;

    transition:
        opacity 0.15s ease;
}


/* =========================================================
   地圖載入提示
========================================================= */

#loading {
    position: absolute;

    top: 50%;
    left: 50%;

    transform:
        translate(-50%, -50%);

    z-index: 30;

    padding: 15px 25px;

    background:
        rgba(255,255,255,0.95);

    border-radius: 6px;

    box-shadow:
        0 4px 15px rgba(0,0,0,0.15);
}


/* =========================================================
   手機
========================================================= */

@media (max-width: 900px) {

    #container {
        display: block;
    }

    #story {
        width: 100%;
        padding: 40px 25px;
    }

    #map-container {
        width: 100%;
        height: 55vh;

        position: sticky;
        bottom: 0;
        top: auto;
    }

    #connection-layer {
        display: none;
    }
}
</style>
</head>


<body>


<div id="container">


<!-- =====================================================
     左側：論文
===================================================== -->

<article id="story">

<h1>大武林野調查</h1>

<div class="author">
    森林計畫事業區分調查史料
</div>


<div class="paper-body">


<!--
===========================================================
注意：

這裡保留你原本論文全文的位置。

把你的「完整論文全文」直接貼進來。
不要自行切割成新的 story step。
===========================================================
-->


<p>
大武調查區的森林計畫事業區分調查，涉及大武地區山林土地的分類、蕃人保留地以及相關土地利用情形。
在相關史料中，可以看到當時官方對於土地、林野以及蕃人生活空間的調查。
</p>


<p>
在調查資料中，可以看到不同的準要存置林野土地。
其中部分土地與各蕃社的生活空間具有密切關係，例如
<span
    class="place-link"
    data-place="近黃社"
>
近黃社
</span>
等地名。
</p>


<p>
相關史料同時記錄了不同土地的番號、地名與面積。
這些資料可以透過地圖進一步理解其空間位置。
</p>


<p>
例如，
<span
    class="place-link"
    data-place="Botsuketsu社蕃地"
>
Botsuketsu社蕃地
</span>
在準要存置林野資料中具有相應的空間範圍。
</p>


</div>

</article>



<!-- =====================================================
     右側：地圖
===================================================== -->

<div id="map-container">

<div id="map"></div>

<div id="loading">
    地圖載入中……
</div>

<div id="place-info">
    <strong id="place-name"></strong>
</div>

</div>

</div>



<!-- =====================================================
     左文 → 右圖連線 SVG
===================================================== -->

<svg
    id="connection-layer"
    xmlns="http://www.w3.org/2000/svg"
>

<path
    id="connection-line"
    d=""
/>

<circle
    id="connection-dot"
    cx="0"
    cy="0"
    r="6"
/>

</svg>



<script>

/* =========================================================
   Mapbox
========================================================= */

mapboxgl.accessToken =
    '您的_MAPBOX_ACCESS_TOKEN';


const map =
    new mapboxgl.Map({

        container: 'map',

        style:
            'mapbox://styles/mapbox/outdoors-v12',

        center:
            [120.887, 22.352],

        zoom:
            10.5,

        pitch:
            0,

        bearing:
            0,

        attributionControl:
            true
    });


/* =========================================================
   GeoJSON
========================================================= */

const GEOJSON_URL =
    'https://raw.githubusercontent.com/willson0505/Dawu/main/%E5%A4%A7%E6%AD%A6%E6%BA%96%E8%A6%81%E5%AD%98%E7%BD%AE%E5%9C%96%E5%B1%A4.geojson';


/* =========================================================
   地名對照表

   左邊論文名稱
          ↓
   GeoJSON properties["地名"]

   如果之後發現其他名稱不同，
   只需要在這裡增加。
========================================================= */

const placeAlias = {

    "近黃社":
        "近黃社",

    "Botsuketsu社":
        "Botsuketsu社蕃地",

    "Botsuketsu社蕃地":
        "Botsuketsu社蕃地"

};


/* =========================================================
   儲存 GeoJSON
========================================================= */

let placeFeatures = [];

let activeFeature = null;

let activePlace = null;


/* =========================================================
   地圖初始化
========================================================= */

map.on('load', async function() {

    try {

        const response =
            await fetch(GEOJSON_URL);

        if (!response.ok) {

            throw new Error(
                'GeoJSON HTTP error: ' +
                response.status
            );

        }

        const geojson =
            await response.json();


        /*
         * 確認資料
         */

        console.log(
            '大武準要存置圖層：',
            geojson
        );


        /*
         * 儲存 Feature
         */

        placeFeatures =
            geojson.features || [];


        /*
         * 建立 GeoJSON source
         */

        map.addSource(
            'semi-keep-source',
            {
                type: 'geojson',
                data: geojson
            }
        );


        /*
         * 原始準要存置林野
         */

        map.addLayer({

            id:
                'semi-keep-layer',

            type:
                'fill',

            source:
                'semi-keep-source',

            paint: {

                'fill-color':
                    '#f0a500',

                'fill-opacity':
                    0.35
            }

        });


        /*
         * 外框
         */

        map.addLayer({

            id:
                'semi-keep-outline',

            type:
                'line',

            source:
                'semi-keep-source',

            paint: {

                'line-color':
                    '#9a6414',

                'line-width':
                    1.2,

                'line-opacity':
                    0.8
            }

        });


        /*
         * 高亮 polygon
         *
         * 不改變原 GeoJSON。
         * 使用 filter 顯示目前選取地名。
         */

        map.addLayer({

            id:
                'place-highlight',

            type:
                'line',

            source:
                'semi-keep-source',

            paint: {

                'line-color':
                    '#e53935',

                'line-width':
                    5,

                'line-opacity':
                    0.95,

                'line-blur':
                    1.5
            },

            filter:
                [
                    '==',
                    ['get', '地名'],
                    ''
                ]

        });


        /*
         * 地名標籤
         *
         * 不使用 popup。
         */

        map.addLayer({

            id:
                'place-label',

            type:
                'symbol',

            source:
                'semi-keep-source',

            layout: {

                'text-field':
                    [
                        'coalesce',
                        ['get', '地名'],
                        ''
                    ],

                'text-size':
                    13,

                'text-font':
                    [
                        'Open Sans Bold',
                        'Arial Unicode MS Bold'
                    ],

                'text-anchor':
                    'center',

                'text-allow-overlap':
                    false

            },

            paint: {

                'text-color':
                    '#333',

                'text-halo-color':
                    '#fff',

                'text-halo-width':
                    2
            }

        });


        /*
         * 隱藏載入提示
         */

        document
            .getElementById('loading')
            .style.display =
            'none';


        /*
         * 開始建立左文地名
         */

        setupPlaceLinks();


    } catch(error) {

        console.error(
            'GeoJSON 載入失敗：',
            error
        );

        document
            .getElementById('loading')
            .textContent =
            'GeoJSON 載入失敗，請檢查檔案路徑。';

    }

});


/* =========================================================
   建立左側地名事件
========================================================= */

function setupPlaceLinks() {

    const links =
        document.querySelectorAll(
            '.place-link'
        );


    links.forEach(
        function(link) {

            link.addEventListener(
                'mouseenter',
                function() {

                    const name =
                        link.dataset.place;

                    activatePlace(
                        name,
                        link
                    );

                }
            );


            link.addEventListener(
                'mouseleave',
                function() {

                    /*
                     * 不立刻關閉。
                     *
                     * 如果使用者從文字移動到地圖，
                     * 仍然保留目前 highlight。
                     */

                }
            );

        }
    );

}


/* =========================================================
   找 GeoJSON 地名
========================================================= */

function findPlaceFeature(
    articleName
) {

    /*
     * 先透過 alias 取得
     * GeoJSON 真正名稱
     */

    const targetName =
        placeAlias[articleName] ||
        articleName;


    /*
     * 精確比對
     */

    let feature =
        placeFeatures.find(
            function(f) {

                const name =
                    f.properties &&
                    f.properties["地名"];

                return name === targetName;

            }
        );


    /*
     * 如果精確比對不到，
     * 嘗試中文名稱包含。
     *
     * 例如：
     *
     * 近黃社
     *
     * ↔
     *
     * 近黃社蕃地
     */

    if (!feature) {

        feature =
            placeFeatures.find(
                function(f) {

                    const name =
                        f.properties &&
                        f.properties["地名"];

                    if (!name) {
                        return false;
                    }

                    return (
                        name.includes(articleName) ||
                        articleName.includes(name)
                    );

                }
            );

    }


    return feature || null;

}


/* =========================================================
   啟用地名
========================================================= */

function activatePlace(
    articleName,
    element
) {

    const feature =
        findPlaceFeature(
            articleName
        );


    console.log(
        '搜尋地名：',
        articleName
    );

    console.log(
        '找到 GeoJSON：',
        feature
    );


    /*
     * 找不到
     */

    if (!feature) {

        console.warn(
            'GeoJSON 找不到地名：',
            articleName
        );

        clearConnection();

        return;
    }


    activeFeature =
        feature;

    activePlace =
        articleName;


    /*
     * 取得 GeoJSON 真正名稱
     */

    const realName =
        feature.properties["地名"];


    /*
     * 高亮 polygon
     */

    if (map.getLayer(
        'place-highlight'
    )) {

        map.setFilter(
            'place-highlight',
            [
                '==',
                ['get', '地名'],
                realName
            ]
        );

    }


    /*
     * 地圖自動移動到 polygon
     */

    const center =
        getFeatureCenter(
            feature
        );


    if (center) {

        map.easeTo({

            center:
                center,

            duration:
                800,

            essential:
                true

        });

    }


    /*
     * 右上角資訊
     */

    document
        .getElementById(
            'place-name'
        )
        .textContent =
        realName;


    document
        .getElementById(
            'place-info'
        )
        .classList
        .add('visible');


    /*
     * 等地圖移動後重新畫線
     */

    setTimeout(
        function() {

            drawConnection(
                element,
                feature
            );

        },
        100
    );

}


/* =========================================================
   計算 Feature 中心點

   支援：

   Polygon
   MultiPolygon
========================================================= */

function getFeatureCenter(
    feature
) {

    if (
        !feature ||
        !feature.geometry
    ) {

        return null;
    }


    const geometry =
        feature.geometry;


    let points = [];


    if (
        geometry.type ===
        'Polygon'
    ) {

        geometry.coordinates
            .forEach(
                function(ring) {

                    ring.forEach(
                        function(point) {

                            points.push(
                                point
                            );

                        }
                    );

                }
            );

    }


    else if (
        geometry.type ===
        'MultiPolygon'
    ) {

        geometry.coordinates
            .forEach(
                function(polygon) {

                    polygon.forEach(
                        function(ring) {

                            ring.forEach(
                                function(point) {

                                    points.push(
                                        point
                                    );

                                }
                            );

                        }
                    );

                }
            );

    }


    if (!points.length) {

        return null;

    }


    /*
     * Bounding box center
     */

    let minLng =
        Infinity;

    let maxLng =
        -Infinity;

    let minLat =
        Infinity;

    let maxLat =
        -Infinity;


    points.forEach(
        function(point) {

            const lng =
                point[0];

            const lat =
                point[1];


            minLng =
                Math.min(
                    minLng,
                    lng
                );

            maxLng =
                Math.max(
                    maxLng,
                    lng
                );

            minLat =
                Math.min(
                    minLat,
                    lat
                );

            maxLat =
                Math.max(
                    maxLat,
                    lat
                );

        }
    );


    return [

        (minLng + maxLng) / 2,

        (minLat + maxLat) / 2

    ];

}


/* =========================================================
   畫「左文 → 右圖」連線
========================================================= */

function drawConnection(
    element,
    feature
) {

    if (!feature) {

        return;

    }


    const center =
        getFeatureCenter(
            feature
        );


    if (!center) {

        return;

    }


    /*
     * Mapbox 地圖上的經緯度
     * → 螢幕座標
     */

    const mapPoint =
        map.project(
            center
        );


    /*
     * 左側文字位置
     */

    const rect =
        element.getBoundingClientRect();


    const startX =
        rect.right;

    const startY =
        rect.top +
        rect.height / 2;


    /*
     * 地圖位置
     *
     * map.project()
     * 是相對於 map container。
     */

    const mapRect =
        document
            .getElementById(
                'map'
            )
            .getBoundingClientRect();


    const endX =
        mapRect.left +
        mapPoint.x;


    const endY =
        mapRect.top +
        mapPoint.y;


    /*
     * 貝茲曲線控制點
     */

    const control1X =
        startX +
        (endX - startX) *
        0.35;


    const control2X =
        startX +
        (endX - startX) *
        0.70;


    const path =
        `
        M ${startX} ${startY}
        C
        ${control1X} ${startY},
        ${control2X} ${endY},
        ${endX} ${endY}
        `;


    const line =
        document.getElementById(
            'connection-line'
        );


    const dot =
        document.getElementById(
            'connection-dot'
        );


    line.setAttribute(
        'd',
        path
    );


    dot.setAttribute(
        'cx',
        endX
    );


    dot.setAttribute(
        'cy',
        endY
    );


    line.style.opacity =
        '1';

    dot.style.opacity =
        '1';

}


/* =========================================================
   清除連線
========================================================= */

function clearConnection() {

    const line =
        document.getElementById(
            'connection-line'
        );

    const dot =
        document.getElementById(
            'connection-dot'
        );


    line.style.opacity =
        '0';

    dot.style.opacity =
        '0';


    if (
        map.getLayer(
            'place-highlight'
        )
    ) {

        map.setFilter(
            'place-highlight',
            [
                '==',
                ['get', '地名'],
                ''
            ]
        );

    }


    document
        .getElementById(
            'place-info'
        )
        .classList
        .remove(
            'visible'
        );

}


/* =========================================================
   地圖移動 / 縮放時
   重新計算連線位置
========================================================= */

map.on(
    'move',
    function() {

        if (
            activeFeature &&
            activePlace
        ) {

            const element =
                document.querySelector(
                    '.place-link[data-place="' +
                    CSS.escape(activePlace) +
                    '"]'
                );


            if (element) {

                drawConnection(
                    element,
                    activeFeature
                );

            }

        }

    }
);


map.on(
    'zoom',
    function() {

        if (
            activeFeature &&
            activePlace
        ) {

            const element =
                document.querySelector(
                    '.place-link[data-place="' +
                    CSS.escape(activePlace) +
                    '"]'
                );


            if (element) {

                drawConnection(
                    element,
                    activeFeature
                );

            }

        }

    }
);


window.addEventListener(
    'resize',
    function() {

        if (
            activeFeature &&
            activePlace
        ) {

            const element =
                document.querySelector(
                    '.place-link[data-place="' +
                    CSS.escape(activePlace) +
                    '"]'
                );


            if (element) {

                drawConnection(
                    element,
                    activeFeature
                );

            }

        }

    }
);

</script>

</body>
</html>
