<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="utf-8">
    <title>大武林野調查地圖</title>
    <meta name="viewport" content="initial-scale=1,maximum-scale=1,user-scalable=no">
    <script src="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.js"></script>
    <link href="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.css" rel="stylesheet">
    <style>
        body { margin: 0; padding: 0; display: flex; }
        #sidebar { width: 40%; height: 100vh; overflow-y: auto; padding: 20px; box-sizing: border-box; }
        #map { width: 60%; height: 100vh; }
        .card { margin-bottom: 300px; padding: 20px; background: #f9f9f9; border-radius: 8px; cursor: pointer; }
    </style>
</head>
<body>

<div id="sidebar">
    <div class="card" onclick="flyToDawu()">
        <h2>壹、土地的狀況</h2>
        <p>點擊此處飛往大武地區...</p>
    </div>
</div>

<div id="map"></div>

<script>
    mapboxgl.accessToken = '您的_MAPBOX_ACCESS_TOKEN'; // 請替換為您的 Token

    const map = new mapboxgl.Map({
        container: 'map',
        style: 'mapbox://styles/mapbox/outdoors-v12',
        center: [120.887, 22.352], // 大武地區經緯度 [lng, lat]
        zoom: 11
    });

    map.on('load', () => {
        // 1. 載入「大武要存置圖層」
        map.addSource('keep-source', {
            type: 'geojson',
            data: './大武要存置圖層.geojson'
        });
        map.addLayer({
            id: 'keep-layer',
            type: 'fill',
            source: 'keep-source',
            paint: {
                'fill-color': '#2e7d32', // 綠色
                'fill-opacity': 0.5
            }
        });

        // 2. 載入「大武準要存置圖層」
        map.addSource('semi-keep-source', {
            type: 'geojson',
            data: './大武準要存置圖層.geojson'
        });
        map.addLayer({
            id: 'semi-keep-layer',
            type: 'fill',
            source: 'semi-keep-source',
            paint: {
                'fill-color': '#f9a825', // 黃色
                'fill-opacity': 0.5
            }
        });

        // 3. 載入「大武不要存置圖層」
        map.addSource('remove-source', {
            type: 'geojson',
            data: './大武不要存置圖層.geojson'
        });
        map.addLayer({
            id: 'remove-layer',
            type: 'fill',
            source: 'remove-source',
            paint: {
                'fill-color': '#c62828', // 紅色
                'fill-opacity': 0.5
            }
        });
    });

    // 定位飛往函數
    function flyToDawu() {
        map.flyTo({
            center: [120.887, 22.352],
            zoom: 12,
            essential: true
        });
    }
</script>
</body>
</html>
